<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPSC TRE Computer Science - CBT Simulation Suite</title>
<style>
  :root {
    --bg-page: #f8fafc;
    --panel-bg: #ffffff;
    --border-color: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-accent: #2563eb;
    --cbt-green: #10b981;
    --cbt-green-light: #ecfdf5;
    --shadow-soft: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg-page); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
  .dash-header { background: var(--panel-bg); border-bottom: 1.5px solid var(--border-color); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
  .dash-brand { font-size: 18px; font-weight: 800; color: var(--text-accent); display: flex; align-items: center; gap: 10px; }
  .dash-tag { background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .dash-container { max-width: 1080px; width: 100%; margin: 32px auto; padding: 0 20px; flex: 1; }
  .section-headline { font-size: 22px; font-weight: 800; margin-bottom: 6px; color: var(--text-primary); }
  .section-sub { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; }
  .tab-bar { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
  .tab-btn { background: none; border: none; font-size: 14px; font-weight: 700; color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  .tab-btn.active { background: #eff6ff; color: var(--text-accent); }
  .tests-grid { display: flex; flex-direction: column; gap: 16px; }
  .test-card {
    background: var(--panel-bg); border: 1.5px solid var(--border-color); border-radius: 12px;
    padding: 22px 26px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: var(--shadow-soft); transition: 0.2s ease;
  }
  .test-card:hover { border-color: var(--text-accent); transform: translateY(-2px); }
  .card-left { display: flex; flex-direction: column; gap: 8px; }
  .test-title-row { display: flex; align-items: center; gap: 12px; }
  .test-badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .badge-mock {
  background: #dbeafe;
  color: #1d4ed8;
}
  .test-title { font-size: 17px; font-weight: 700; color: var(--text-primary); }
  .test-meta { display: flex; gap: 18px; font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
  .meta-item { display: flex; align-items: center; gap: 6px; }
  .card-right { display: flex; align-items: center; gap: 14px; }
  .attempt-info { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); text-align: right; }
  .btn-action { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 700; transition: 0.2s; }
  .btn-start { background: var(--text-accent); color: white; }
  .btn-start:hover { background: #1d4ed8; }
  .btn-reattempt { background: var(--cbt-green-light); color: var(--cbt-green); border: 1.5px solid var(--cbt-green); }
  .btn-reattempt:hover { background: #d1fae5; }
</style>
</head>
<body>

<header class="dash-header">
  <div class="dash-brand">
    BPSC TRE Computer Science
    <span class="dash-tag">Full Length CBT Series</span>
  </div>
</header>

<main class="dash-container">
  <h1 class="section-headline">Full Length Mock Tests</h1>
  <p class="section-sub">Actual BPSC TRE Exam Pattern: 150 Questions, Qualifying Language (Q1-30), 120 Merit Pool (Q31-150), Strict 1/3 Negative Marking aur Auto-Sync backup ke saath.</p>

  <div class="tab-bar">
    <button class="tab-btn active">All Tests</button>
  </div>

  <div class="tests-grid" id="testsListContainer"></div>
</main>

<script>
  const TESTS_REGISTRY = [
    {
      id: "BPSC_TRE_MOCK_1",
      title: "BPSC TRE Full Length Mock Test 1",
      fileUrl: "mock1.html",
      type: "Full Length Mock",
      badgeClass: "badge-mock",
      questions: 150,
      meritPool: 120,
      timeMins: 150,
      negativePenalty: "-1/3"
    },
    {
      id: "BPSC_TRE_MOCK_2",
      title: "BPSC TRE Full Length Mock Test 2",
      fileUrl: "mock2.html",
      type: "Full Length Mock",
      badgeClass: "badge-mock",
      questions: 150,
      meritPool: 120,
      timeMins: 150,
      negativePenalty: "-1/3"
    }
  ];

  function renderDashboard() {
    const container = document.getElementById("testsListContainer");
    container.innerHTML = "";

    TESTS_REGISTRY.forEach(test => {
      const storageKey = `bpsc_cbt_${test.id}_data`;
      let attCount = 0;
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw) attCount = JSON.parse(raw).length;
      } catch (e) {}

      const card = document.createElement("div");
      card.className = "test-card";

      const isAttempted = attCount > 0;
      const attText = isAttempted 
        ? `<span style="color:var(--cbt-green); font-weight:700;">Completed (${attCount} Attempt)</span>` 
        : `Unattempted (0 Attempts)`;
      
      const btnText = isAttempted ? `View Result / Reattempt ↻` : `Start Test &rarr;`;
      const btnClass = isAttempted ? `btn-action btn-reattempt` : `btn-action btn-start`;

      card.innerHTML = `
        <div class="card-left">
          <div class="test-title-row">
            <span class="test-badge ${test.badgeClass}">${test.type}</span>
            <h2 class="test-title">${test.title}</h2>
          </div>
          <div class="test-meta">
            <span class="meta-item">📝 ${test.questions} Questions</span>
            <span class="meta-item">🎯 ${test.meritPool} Merit Pool (40 GS + 80 CS)</span>
            <span class="meta-item">⏳ ${test.timeMins} Mins</span>
            <span class="meta-item">⚠️ ${test.negativePenalty} Negative Marking</span>
          </div>
        </div>
        <div class="card-right">
          <div class="attempt-info">${attText}</div>
          <a href="${test.fileUrl}" class="${btnClass}">${btnText}</a>
        </div>
      `;

      container.appendChild(card);
    });
  }

  window.addEventListener("DOMContentLoaded", renderDashboard);
</script>
</body>
</html>
